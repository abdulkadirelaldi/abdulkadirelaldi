<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Bağlantı yok · AE Panel</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f2f2f7;
        color: #0a0a0f;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
          color: #fafafa;
        }
        p {
          color: #8e8e99 !important;
        }
      }
      h1 {
        font-size: 24px;
        margin: 16px 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        color: #6e6e78;
        margin: 0 0 24px;
        line-height: 1.5;
        max-width: 320px;
      }
      a {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 14px;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        background: linear-gradient(135deg, #6d4aff, #8b3dff);
      }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 44px" aria-hidden="true">📡</div>
      <h1>Bağlantı yok</h1>
      <p>
        İnternete bağlanınca panel açılır. Hızlı eklediğin kayıtlar telefonda bekler, kaybolmaz.
      </p>
      <a href="/panel">Yeniden dene</a>
    </main>
  </body>
</html>
