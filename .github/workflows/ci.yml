name: CI

# PROGRAM.md §10.5 / §10.6 — "Bir görev şunların hepsi sağlanmadan tamamlandı
# sayılmaz". Bu dosya o cümleyi otomatik bir kapıya çevirir: `kapi` işi
# düşerse merge yok.
#
# İlgili ADR: ADR-003 (pnpm), ADR-006 (postinstall), ADR-008 (Node 22),
# ADR-009 (GitHub Actions).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# En az yetki: hat yalnızca kodu okur. Hiçbir iş yazma izni istemiyor.
permissions:
  contents: read

# Aynı dal için yeni push gelirse eskisini iptal et — koşucu boşa yanmasın.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  # Derleme ve kullanım verisi Vercel'e gitmesin (§8 gizlilik duruşu).
  NEXT_TELEMETRY_DISABLED: '1'
  # F0'da kapsam eşiği RAPORLANIR, zorlanmaz. F1 sonunda '1' yapılacak —
  # tek satır, tek yer. Ayrıntı: vitest.config.ts.
  COVERAGE_ENFORCE: '0'

jobs:
  # ---------------------------------------------------------------------------
  # ANA KAPI — §10.6. Adımlar sıralıdır ve ilki düşerse sonrakiler koşmaz.
  # ---------------------------------------------------------------------------
  kapi:
    name: 'Kapı: lint → typecheck → test → build → e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # §9 senaryo 3 ve §8.1 kapısı GERÇEK bir veritabanı ister: giriş akışı
    # kullanıcı kaydına, 2FA kurulumu `User.totpConfirmedAt`'e bakıyor.
    #
    # NEDEN EKLENDİ (T-016/T3 → T-005b): DB olmadan `auth.spec.ts` kendini
    # atlıyordu ve koşum "19 skipped" ile YEŞİL geçiyordu. Yani dört `code`
    # regresyon kilidi ve §8.1 kapısı merge kapısında HİÇ TUTMUYORDU —
    # yalnızca geliştirici makinesinde koşuyorlardı. Yerel bir kilit,
    # kilit değildir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aelaldi_ci
        ports:
          - 5432:5432
        # Koşucu, sağlık kontrolü geçene kadar adımları başlatmaz.
        options: >-
          --health-cmd "pg_isready -U ci -d aelaldi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # CI-YEREL, ATILABİLİR DEĞERLER — hiçbiri gerçek sır değildir.
    #
    # ADR-009 ve BULGU-002: derlemenin veritabanına ihtiyacı yok ve GERÇEK
    # `DATABASE_URL` asla CI secret'ı yapılmaz. Buradaki veritabanı koşumla
    # birlikte doğup ölen bir servis container'ı; `AUTH_SECRET` ve
    # `TOTP_ENCRYPTION_KEY` ise yalnızca bu koşumda üretilen jetonları
    # imzalamak için. Değerler bilerek "ci-test" ibaresi taşıyor ki ileride
    # biri bunları gerçek bir sır sanmasın.
    #
    # `DATABASE_URL` BİLEREK BURADA DEĞİL, yalnızca ihtiyacı olan adımlarda.
    # Gerekçe "Üretim derlemesi" adımının başında.
    env:
      AUTH_SECRET: ci-test-only-auth-secret-not-a-real-value
      TOTP_ENCRYPTION_KEY: Y2ktdGVzdC1vbmx5LW5vdC1hLXJlYWwta2V5LTAwMDA=
      ADMIN_EMAIL: ci@ornek.test
      # §8.2 — `passwordSchema` en az 12 karakter istiyor.
      ADMIN_PASSWORD: ci-test-parolasi-1234

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      # pnpm sürümü `package.json` → `packageManager` alanından okunur (ADR-003).
      # Ayrı bir yere sürüm yazmıyoruz ki sapma ihtimali olmasın.
      - name: pnpm kur
        uses: pnpm/action-setup@v6

      # ADR-008 TEK KAYNAĞI: `.nvmrc`. Sürüm burada elle yazılmaz.
      - name: Node kur (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # ADR-008'in üç ayağının fiilen aynı olduğunu doğrular. Bu adım olmasaydı
      # `.nvmrc` ile `engines` sessizce ayrışabilir ve "yerelde çalışıyor, CI'da
      # çalışmıyor" sınıfı hatalar geri gelirdi.
      - name: Sürüm senkronu (.nvmrc ↔ engines ↔ çalışan Node)
        run: |
          node <<'BETIK'
          const { readFileSync } = require('node:fs');

          const nvmrc = readFileSync('.nvmrc', 'utf8').trim();
          const engines = require('./package.json').engines.node;
          const calisan = process.versions.node;

          const nvmrcAna = Number.parseInt(nvmrc.replace(/^v/, ''), 10);
          const enginesAna = Number.parseInt(engines.replace(/^[^\d]*/, ''), 10);
          const calisanAna = Number.parseInt(calisan, 10);

          console.log(`.nvmrc=${nvmrc} engines="${engines}" calisan=v${calisan}`);

          const hatalar = [];
          if (nvmrcAna !== enginesAna) {
            hatalar.push(`.nvmrc (${nvmrcAna}) ile engines (${enginesAna}) ana sürümü farklı`);
          }
          if (calisanAna !== nvmrcAna) {
            hatalar.push(`Çalışan Node (${calisanAna}) .nvmrc (${nvmrcAna}) ile uyuşmuyor`);
          }
          if (hatalar.length > 0) {
            console.error('ADR-008 ihlali:\n- ' + hatalar.join('\n- '));
            process.exit(1);
          }
          console.log('ADR-008: üç kaynak da uyumlu.');
          BETIK

      # ADR-006: `postinstall` → `prisma generate` burada kendiliğinden koşar.
      # Ayrıca `prisma generate` çağırmaya GEREK YOK.
      #
      # `.env` YOK ve Postgres servisi YOK — T-003c'den beri zincirin tamamı
      # bu koşulda geçiyor. Gerçek DATABASE_URL secret'ı BİLEREK verilmiyor:
      # derlemenin veritabanına ihtiyacı yok (BULGU-002).
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: 1/5 · Lint
        run: pnpm lint

      - name: 2/5 · Typecheck
        run: pnpm typecheck

      # Kapsam raporu burada üretilir. Eşik (%70) yapılandırılmıştır ancak
      # COVERAGE_ENFORCE=0 olduğu için şimdilik yalnızca raporlanır.
      # §8.18'in `.env.example` ve `process.env` katmanları da bu adımda koşar.
      - name: 3/5 · Birim + bileşen testleri (kapsam)
        run: pnpm test

      # DİKKAT — bu adımda `DATABASE_URL` BİLEREK TANIMSIZ.
      #
      # BULGU-002 tam olarak buydu: derleme veritabanı bağlantısı istiyordu ve
      # `.env` bulunmayan her ortamda (CI, Docker build katmanı, taze klon)
      # çöküyordu. T-003c havuzu tembel kuruluma çevirerek düzeltti.
      #
      # T-005b veritabanını CI'ya soktu ama `DATABASE_URL`'i İŞ DÜZEYİNE
      # KOYMADI; yalnızca migrate/seed/e2e adımlarına verdi. Böylece bu adım
      # o düzeltmenin canlı gerileme testi olmayı SÜRDÜRÜYOR: biri derlemeyi
      # yeniden DB'ye bağımlı hâle getirirse burası kırmızı olur.
      - name: 4/5 · Üretim derlemesi (DATABASE_URL OLMADAN — BULGU-002 nöbeti)
        run: pnpm build

      # §8.18'in ÜÇÜNCÜ katmanı: derleme çıktısında sır var mı?
      # Aynı test dosyası `test` adımında derleme yokken ilgili blokları
      # atlamıştı; `.next/` artık var olduğu için burada gerçekten tarar.
      - name: 5/5 · §8.18 — derleme çıktısında gizli bilgi taraması
        run: pnpm exec vitest run tests/unit/public-env.test.ts

      # --- Veritabanı hazırlığı — buradan sonrası DATABASE_URL ister ---------
      #
      # `prisma migrate dev` DEĞİL `deploy`: `dev` etkileşimlidir, eksik
      # migration üretmeye kalkar ve gerektiğinde veritabanını SIFIRLAR.
      # CI'da istenen, var olan migration zincirini olduğu gibi uygulamaktır.
      # `pnpm db:migrate` script'i `dev` çalıştırdığı için bilerek
      # kullanılmadı — `package.json` bu görevin kapsamı dışında ve yeni
      # script talep etmeye değmiyor.
      - name: DB şeması (prisma migrate deploy)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/aelaldi_ci
        run: pnpm exec prisma migrate deploy

      # Seed yönetici hesabını açar; `auth.spec.ts` onunla giriş yapıyor.
      # 2FA'yı KAPALI bırakır (T-013b, bilinçli) — §8.1 kapısının test ettiği
      # başlangıç durumu tam olarak budur.
      - name: Seed (yönetici hesabı)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/aelaldi_ci
        run: pnpm db:seed

      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright tarayıcılarını kur
        run: pnpm exec playwright install --with-deps chromium

      # `playwright.config.ts` CI'da yeniden derlemez; yukarıdaki derleme
      # adımının çıktısını kullanır. Yani `build` düşerse E2E hiç koşmaz.
      #
      # `DATABASE_URL` burada ŞART: hem `globalSetup` (test verisi hazırlığı)
      # hem de `pnpm start` ile ayağa kalkan uygulama ona bakıyor.
      - name: E2E (masaüstü + mobil, auth paketi dahil)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/aelaldi_ci
        run: pnpm test:e2e

      # Auth paketinin GERÇEKTEN koştuğunu doğrular.
      #
      # NEDEN AYRI BİR ADIM: Playwright, atlanan testler için sıfır olmayan bir
      # çıkış kodu ÜRETMEZ. Veritabanı bir gün sessizce erişilemez hâle gelirse
      # `auth.spec.ts` kendini atlar, koşum yine YEŞİL olur ve §8.1 kapısıyla
      # dört `code` kilidi farkında olmadan devre dışı kalır — T-005b'nin
      # çözdüğü sorunun aynısı geri gelir. Bu adım o sessiz gerilemeyi
      # gürültülü bir hataya çevirir.
      - name: Atlanan test yok (auth paketi koştu mu?)
        run: |
          node <<'BETIK'
          const { readFileSync } = require('node:fs');
          const rapor = JSON.parse(readFileSync('playwright-sonuc.json', 'utf8'));

          const atlanan = rapor.stats?.skipped ?? 0;
          const gecen = rapor.stats?.expected ?? 0;
          console.log(`geçen=${gecen} atlanan=${atlanan}`);

          if (atlanan > 0) {
            console.error(
              `${atlanan} test ATLANDI. Auth paketi veritabanı yoksa kendini atlar; ` +
                'bu koşum §8.1 kapısını ve `code` regresyon kilitlerini DOĞRULAMAMIŞTIR.',
            );
            process.exit(1);
          }
          BETIK

      - name: Kapsam raporunu sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kapsam-raporu
          path: coverage/
          retention-days: 14

      - name: Playwright raporunu sakla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # §8.24 — "npm audit yüksek/kritik açıkla merge yok".
  # Ayrı iş: kapıdan bağımsız ve hızlı geri bildirim verir, ama düşerse
  # yine merge engellenir (dal koruması her iki işi de zorunlu sayar).
  # ---------------------------------------------------------------------------
  bagimlilik-denetimi:
    name: §8.24 · Bağımlılık denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      # ADR-003 gereği `npm audit` değil `pnpm audit`. `--audit-level high`
      # yüksek VE kritik seviyeyi kapsar; bulgu varsa çıkış kodu sıfır değildir.
      - name: pnpm audit (yüksek + kritik)
        run: pnpm audit --audit-level high

      # Kilit dosyası ile package.json ayrışmışsa `--frozen-lockfile` zaten
      # düşer; bu adım niyeti açık kılar ve ADR-003'ün diğer paket
      # yöneticilerini yasaklamasını uygular.
      - name: Yabancı kilit dosyası yok (ADR-003)
        run: |
          for dosya in package-lock.json yarn.lock npm-shrinkwrap.json; do
            if [ -f "$dosya" ]; then
              echo "ADR-003 ihlali: $dosya depoda bulunmamalı."
              exit 1
            fi
          done
          echo "Yalnızca pnpm-lock.yaml var."

  # ---------------------------------------------------------------------------
  # §9 — Lighthouse eşikleri.
  #
  # F0'da UYARI modunda (`lighthouserc.json` → level "warn"): public sayfalar
  # henüz yazılmadı, `/` şu an T-002'nin geçici doğrulama sayfası. Gerçek
  # eşikleri bugün zorlamak, ölçülen şey ile hedeflenen şey farklı olduğu için
  # anlamsız bir kırmızı üretirdi.
  #
  # F2 sonunda (T-029) "warn" → "error" çevrilecek; o noktada ölçülen sayfa
  # gerçek ana sayfa olacak.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: §9 · Lighthouse (uyarı modunda — T-029'da error olacak)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: kapi

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Üretim derlemesi
        run: pnpm build

      # `@lhci/cli` BİLEREK package.json'a eklenmedi: yalnızca CI'da kullanılan
      # bir araç, uygulamanın bağımlılığı değil. Sürüm sabitlenmiştir —
      # `latest` kullanmak her koşuda denetlenmemiş kod indirmek olurdu (§8.25).
      #
      # `PORT` artık BURADA VERİLMİYOR — `lighthouserc.json` içindeki
      # `startServerCommand` kendi portunu taşıyor. Önceden port yalnızca bu
      # `env:` bloğunda vardı ve yapılandırma yerelde çalışmıyordu (T-002b).
      - name: Lighthouse — mobil + aydınlık tema
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      # Koyu tema bizim VARSAYILAN temamız (§3) ama başlıksız bir Lighthouse
      # koşusu onu hiç görmez: tema cookie'den okunur ve cookie yoksa 'system'
      # devreye girer — başsız (headless) Chrome'da bu aydınlık demektir.
      # Yani koyu tema, tam da varsayılan olduğu hâlde denetim dışı kalıyordu.
      #
      # Cookie sunucuya gider ve kök layout `<html class="dark">` basar; yani
      # ölçülen şey gerçekten koyu temadır. Kanıt: üretilen raporda
      # `configSettings.extraHeaders` alanı bu başlığı taşır.
      - name: Lighthouse — mobil + koyu tema (varsayılan tema)
        run: |
          pnpm dlx @lhci/cli@0.15.1 autorun \
            --collect.settings.extraHeaders='{"Cookie":"ae-theme=dark"}' \
            --upload.outputDir=lighthouse-raporu/mobil-koyu

      # ÜÇÜNCÜ PROFİL — §5.2'nin EN PAHALI DALI (T-020b/ENGEL-1).
      #
      # Aurora (tek WebGL bileşenimiz) DÖRT koşulun HEPSİ sağlanmadan yüklenmez
      # (`src/components/reactbits/lazy.tsx`):
      #   1. `matchMedia('(min-width: 768px)')`  → masaüstü
      #   2. `prefers-reduced-motion` YOK
      #   3. `resolvedTheme === 'dark'`          → cookie'den
      #   4. hidrasyon (ssr: false)
      #
      # Yukarıdaki iki profil MOBİL emülasyonda (412×823) koşuyor, yani (1)
      # sağlanmıyor ve `ogl` parçası ağdan HİÇ istenmiyor. Sonuç: WebGL yolu
      # bugüne kadar HİÇBİR CI koşusunda ölçülmedi — §5.2'nin en pahalı dalı
      # denetim dışındaydı. Bu profil o boşluğu kapatıyor.
      - name: Lighthouse — masaüstü + koyu tema (WebGL yolu)
        run: |
          pnpm dlx @lhci/cli@0.15.1 autorun \
            --collect.settings.preset=desktop \
            --collect.settings.extraHeaders='{"Cookie":"ae-theme=dark"}' \
            --upload.outputDir=lighthouse-raporu/masaustu-koyu

      # WebGL'in GERÇEKTEN çalıştığını doğrular — skorlara bakarak anlaşılamaz.
      #
      # NEDEN ŞART: masaüstü profili eklenip de dört koşuldan biri sessizce
      # bozulsaydı (örneğin cookie adı değişse, ya da `useMasaustu` eşiği
      # kaysa), Aurora yine yüklenmez ve profil YİNE YEŞİL ölçerdi. O hâlde
      # "WebGL yolunu ölçüyoruz" demek yanlış olurdu — tam da T-019b/K3'teki
      # "vakum hâlinde yeşil" tuzağı.
      #
      # Kanıt ağ isteği üzerinden: Aurora'nın shader'ı `uColorStops` dizesini
      # taşıyor; o dizeyi içeren derleme parçası masaüstü koşusunda İSTENMİŞ,
      # mobil koşusunda İSTENMEMİŞ olmalı (§5.2.5).
      # Ölçülen sayfa Aurora'yı MOUNT EDİYOR MU? Aşağıdaki üç durumlu kontrolün
      # ayırt edicisi bu. `lazy.tsx` sarmalayıcısı, WebGL yüklensin ya da
      # yüklenmesin `aurora-katman` sınıfını HER ZAMAN basıyor; yani sunucudan
      # gelen HTML'de bu sınıfın varlığı "Aurora bu sayfada var" demek.
      - name: Ölçülen sayfa Aurora içeriyor mu?
        run: |
          PORT=3100 pnpm start > /tmp/sunucu.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3100/ && break
            sleep 1
          done
          curl -s -H 'Cookie: ae-theme=dark' http://127.0.0.1:3100/ > /tmp/anasayfa.html
          pkill -f "next start" || true
          if grep -q 'aurora-katman' /tmp/anasayfa.html; then
            echo 'AURORA_SAYFADA=1' >> "$GITHUB_ENV"
            echo 'Ölçülen sayfa Aurora içeriyor.'
          else
            echo 'AURORA_SAYFADA=0' >> "$GITHUB_ENV"
            echo 'Ölçülen sayfa Aurora İÇERMİYOR.'
          fi

      - name: WebGL gerçekten koştu mu? (§5.2.2 / §5.2.5)
        run: |
          node <<'BETIK'
          const { readdirSync, readFileSync, statSync } = require('node:fs');
          const path = require('node:path');

          /** `.next/static` altındaki tüm .js dosyaları. */
          function jsDosyalari(kok) {
            const bulunan = [];
            const gez = (d) => {
              for (const ad of readdirSync(d)) {
                const tam = path.join(d, ad);
                if (statSync(tam).isDirectory()) gez(tam);
                else if (tam.endsWith('.js')) bulunan.push(tam);
              }
            };
            gez(kok);
            return bulunan;
          }

          // 1) Aurora shader'ını taşıyan parçayı bul (ad hash'li, içerikten buluyoruz).
          const auroraParcalari = jsDosyalari('.next/static')
            .filter((f) => readFileSync(f, 'utf8').includes('uColorStops'))
            .map((f) => path.basename(f));

          if (auroraParcalari.length === 0) {
            console.error(
              'Aurora shader parçası derleme çıktısında BULUNAMADI. ' +
                'Bileşen kaldırıldıysa bu adım güncellenmeli; kaldırılmadıysa ' +
                'kod bölme (code splitting) beklenmedik biçimde değişmiş.',
            );
            process.exit(1);
          }
          console.log('Aurora parçası:', auroraParcalari.join(', '));

          /** Bir LHR'nin istediği tüm URL'ler. */
          function istenenler(dizin) {
            const dosya = readdirSync(dizin).find(
              (f) => f.endsWith('.json') && !f.includes('manifest'),
            );
            const lhr = JSON.parse(readFileSync(path.join(dizin, dosya), 'utf8'));
            const items = lhr.audits['network-requests']?.details?.items ?? [];
            return items.map((i) => i.url ?? '');
          }

          const masaustu = istenenler('lighthouse-raporu/masaustu-koyu');
          const mobil = istenenler('lighthouse-raporu/mobil-koyu');

          const yuklendiMi = (urller) =>
            auroraParcalari.some((p) => urller.some((u) => u.includes(p)));

          const masaustuYukledi = yuklendiMi(masaustu);
          const mobilYukledi = yuklendiMi(mobil);

          console.log(`masaüstü ogl indirdi mi : ${masaustuYukledi}`);
          console.log(`mobil    ogl indirdi mi : ${mobilYukledi}`);

          const hatalar = [];

          // §5.2.5 HER KOŞULDA geçerli: mobilde WebGL parçası hiç istenmemeli.
          // Bu dal, Aurora sayfada olsun olmasın anlamlıdır.
          if (mobilYukledi) {
            hatalar.push(
              '§5.2.5 İHLALİ — Mobil profilinde WebGL parçası indirildi. ' +
                'Kural: mobilde WebGL arka planlar HİÇ yüklenmez.',
            );
          }

          /*
           * ÜÇ DURUM, ÜÇ DAVRANIŞ. Ortadaki durum bilerek "hata" değil:
           * Aurora şu an yalnızca React Bits galerisinde kullanılıyor, ölçülen
           * `/` sayfasında değil (T-021 gerçek ana sayfayı yazıyor ve §5.1'e
           * göre hero arka planı Aurora olacak).
           *
           * Bu bekleme hâli KENDİ KENDİNE SONA ERER: sayfa Aurora'yı mount
           * ettiği anda `AURORA_SAYFADA=1` olur ve kontrol ZORUNLU hâle gelir.
           * Elle bir bayrak çevirmek gerekmiyor — unutulacak bir adım yok.
           */
          if (process.env.AURORA_SAYFADA === '1') {
            if (!masaustuYukledi) {
              hatalar.push(
                '§5.2.2 — Sayfa Aurora içeriyor AMA masaüstü profilinde WebGL ' +
                  'parçası indirilmedi. Dört koşuldan biri bozulmuş olmalı ' +
                  '(masaüstü eşiği / hareket kısıtı / tema cookie\'si / hidrasyon). ' +
                  'Bu hâlde profil "WebGL yolunu ölçüyorum" diyemez.',
              );
            } else {
              console.log('§5.2.2 doğrulandı — masaüstünde WebGL yüklendi.');
            }
          } else {
            console.log(
              '⏳ BEKLEMEDE — ölçülen sayfa (/) henüz Aurora mount etmiyor, ' +
                'bu yüzden WebGL yolu ölçülemiyor. Profil ve doğrulama HAZIR: ' +
                'T-021 hero arka planını bağladığı anda bu kontrol kendiliğinden ' +
                'ZORUNLU hâle gelir. Ayrıntı: docs/security/README.md BULGU-010.',
            );
          }

          if (hatalar.length > 0) {
            console.error(hatalar.join('\n'));
            process.exit(1);
          }
          console.log('§5.2.5 doğrulandı — mobilde WebGL indirilmedi.');
          BETIK

      # Üç profilin skorlarını tek yerde, okunabilir biçimde özetler.
      - name: Profil skorları
        if: always()
        run: |
          node <<'BETIK'
          const { existsSync, readdirSync, readFileSync } = require('node:fs');
          const path = require('node:path');

          const profiller = ['mobil-aydinlik', 'mobil-koyu', 'masaustu-koyu'];
          const kategoriler = ['performance', 'accessibility', 'best-practices', 'seo'];

          for (const profil of profiller) {
            const dizin = path.join('lighthouse-raporu', profil);
            if (!existsSync(dizin)) {
              console.log(`\n### ${profil}: rapor yok`);
              continue;
            }

            const raporlar = readdirSync(dizin).filter(
              (f) => f.endsWith('.json') && !f.includes('manifest'),
            );

            const skor = {};
            let cerez = null;
            let ekran = null;
            for (const f of raporlar) {
              const lhr = JSON.parse(readFileSync(path.join(dizin, f), 'utf8'));
              cerez ??= JSON.stringify(lhr.configSettings?.extraHeaders ?? null);
              ekran ??= `${lhr.configSettings?.screenEmulation?.width ?? '?'}x${lhr.configSettings?.screenEmulation?.height ?? '?'}`;
              for (const k of kategoriler) {
                (skor[k] ??= []).push(Math.round((lhr.categories[k]?.score ?? 0) * 100));
              }
            }

            const medyan = (a) => [...a].sort((x, y) => x - y)[Math.floor(a.length / 2)];

            console.log(`\n### ${profil}  (${raporlar.length} koşu, ${ekran}, cookie=${cerez})`);
            for (const k of kategoriler) {
              const d = skor[k] ?? [];
              console.log(
                `  ${k.padEnd(15)} medyan=${String(medyan(d)).padStart(3)}  ` +
                  `[${d.join(', ')}]  yayılım=${Math.max(...d) - Math.min(...d)}`,
              );
            }
          }
          BETIK

      # Yol NOKTA İLE BAŞLAMAMALI: `actions/upload-artifact` gizli dosya ve
      # dizinleri varsayılan olarak atlar. Eski `.lighthouseci/` yolu bu yüzden
      # "No files were found" uyarısı verip sessizce boş artifact üretiyordu —
      # rapor hiçbir yere kaydedilmiyordu (BULGU-004).
      - name: Lighthouse raporunu sakla (üç profil)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-raporu
          path: lighthouse-raporu/
          retention-days: 14
          # Rapor üretilmediyse bu artık sessiz bir uyarı değil, hata olsun.
          if-no-files-found: error
