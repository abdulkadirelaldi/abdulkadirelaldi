# ÜRETİM — PAYLAŞIMLI SUNUCU (nginx + Docker), Coolify YOK. Bkz. docs/yayin-nginx.md.
#
# NEDEN AYRI DOSYA: `docker-compose.prod.yml` Coolify için yazıldı (imajı
# kendisi derler, ters vekil Coolify). Bu sunucuda 80/443'ü müşteri sitelerinin
# nginx'i tutuyor ve 1 CPU'da Next derlemesi diğer siteleri dakikalarca
# yavaşlatır. Burada imajlar GELİŞTİRME makinesinde derlenip hazır gelir
# (`deploy/sunucu/gonder.sh`), dışa açılış mevcut nginx üzerinden.
#
# ZİNCİR aynı: db (sağlıklı) → goc (göç, tamamlandı) → uygulama.
#
# BELLEK SINIRLARI ŞART: sunucuda mailcow ve müşteri siteleri var, boş bellek
# ~1 GB. Sınırsız bir konteyner taşarsa çekirdek RASTGELE bir süreci öldürür —
# bu, müşterinin e-postası olabilir. Sınır taşmayı kendi konteynerimize hapseder.
#
# SIRLAR `.env`te (chmod 600, sunucuda üretildi); bu dosyada sır YOK.

name: aelaldi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    # Kişisel site: küçük tampon ve az bağlantı yeterli; varsayılanlar bu
    # sunucunun belleğine göre cömert.
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=30']
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PORT DIŞARI AÇILMIYOR (§13.2): yalnızca bu projenin iç ağı.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  goc:
    image: aelaldi-araclar:latest
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  uygulama:
    image: aelaldi-uygulama:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET gerekli}
      # ÇALIŞMA ANINDA DA gerekli: sunucu kodu (sitemap, metadata, hreflang)
      # adresi `process.env`ten okuyor — derleme argümanı tek başına yetmiyor
      # (ölçüldü: değişkensiz her public sayfa 500).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL gerekli}
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY gerekli}
      TOTP_ISSUER: ${TOTP_ISSUER:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_SITE_ID: ${UMAMI_SITE_ID:-}
      # Sağlık · tartı görseli okuma ve yorum (Claude API). Boşsa özellik kapalı.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Bildirimler (web push). Boşsa özellik kapalı. Üretmek: docs/yayin-nginx.md.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # V8 yığını konteyner sınırının altında kalsın: sınıra çarpan süreç
      # ÇEKİRDEK tarafından öldürülür, yığın sınırı ise önce çöp toplamayı zorlar.
      NODE_OPTIONS: --max-old-space-size=320
    # YALNIZCA 127.0.0.1: dışarıdan doğrudan erişilemez, önünde nginx (TLS).
    ports:
      - '127.0.0.1:3400:3000'
    depends_on:
      goc:
        condition: service_completed_successfully
    mem_limit: 512m

  araclar:
    image: aelaldi-araclar:latest
    restart: unless-stopped
    # HTTP dinlemez; içerik yükleme, yönetici açma ve yedek betikleri burada koşar.
    command: ['sleep', 'infinity']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      TZ: Europe/Istanbul
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

volumes:
  pgdata:
