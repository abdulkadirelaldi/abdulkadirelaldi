<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="refresh" content="5" />
    <meta name="robots" content="noindex" />
    <title>Güncelleniyor</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 system-ui,
          -apple-system,
          sans-serif;
        background: #0b0b10;
        color: #e8e8ee;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f7f9;
          color: #1a1a22;
        }
      }
      main {
        text-align: center;
        padding: 24px;
      }
      p {
        opacity: 0.7;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px; margin: 0">Site güncelleniyor</h1>
      <p>Birkaç saniye içinde kendiliğinden açılacak.</p>
    </main>
  </body>
</html>
