# abdulkadirelaldi.com — nginx ters vekil (bkz. docs/yayin-nginx.md).
#
# İLK HÂLİ YALNIZCA 80: certbot (`--nginx`) sertifikayı aldığında 443 bloğunu
# ve 80 → 443 yönlendirmesini BU dosyaya kendisi ekler — sunucudaki diğer
# sitelerle aynı düzen ("managed by Certbot").
#
# www → çıplak alan adı: kanonik adres tek (sitemap, hreflang, AUTH_URL hep
# https://abdulkadirelaldi.com). Yönlendirme `uygulama`ya gitmeden burada.

upstream aelaldi_uygulama {
    server 127.0.0.1:3400;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name abdulkadirelaldi.com www.abdulkadirelaldi.com;

    if ($host = www.abdulkadirelaldi.com) {
        return 301 https://abdulkadirelaldi.com$request_uri;
    }

    # Panel dosya yükleme sınırı 10 MiB (MAX_UPLOAD_BYTES) + form payı.
    client_max_body_size 12m;

    location / {
        proxy_pass http://aelaldi_uygulama;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # ⚠️ EZ, EKLEME: uygulama istemci IP'sini X-Forwarded-For'un İLK
        # değerinden okuyor (giriş kilidi, form hız sınırı, denetim kaydı).
        # `$proxy_add_x_forwarded_for` ziyaretçinin yolladığı başlığı korur ve
        # ilk değeri SAHTELENEBİLİR yapar — kilit tek başlıkla atlatılırdı.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 60s;
    }
}
