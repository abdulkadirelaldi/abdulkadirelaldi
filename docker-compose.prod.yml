# ÜRETİM — Coolify "Docker Compose" kurulumu (PROGRAM.md §13, T-070/T-071).
#
# Ayrıntılı kurulum: docs/yayin.md. Değerler Coolify'ın ortam değişkeni
# panelinden gelir; bu dosyada SIR YOK (§8.17).
#
# ZİNCİR:  db (sağlıklı) → goc (göç, tamamlandı) → uygulama
#          araclar: uzun ömürlü, HTTP dinlemez; Coolify "Scheduled Task" gece
#          03:00 yedeğini (§8.21) bunun İÇİNDE koşar.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # §13.2 — PORT DIŞARI AÇILMIYOR: `ports:` yok, yalnızca iç ağ.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  goc:
    build:
      context: .
      target: araclar
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  uygulama:
    build:
      context: .
      target: uygulama
      args:
        # ⚠️ DERLEME ANINDA gerekli — alan adı değişirse YENİDEN DERLE (Dockerfile notu).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL gerekli}
        NEXT_PUBLIC_KIYI_MEDYA_URL: ${NEXT_PUBLIC_KIYI_MEDYA_URL:-https://kiyimedya.com}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET gerekli}
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY gerekli}
      TOTP_ISSUER: ${TOTP_ISSUER:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # İletişim bildirimi — İSTEĞE BAĞLI (ADR-042 eki); boşsa mesaj yalnızca panelde.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
    depends_on:
      goc:
        condition: service_completed_successfully
    # Coolify ters vekili 3000'e yönlendirir; port dışarı açılmıyor.
    expose:
      - '3000'

  araclar:
    build:
      context: .
      target: araclar
    restart: unless-stopped
    # HTTP dinlemez; zamanlanmış görevler için ayakta durur.
    command: ['sleep', 'infinity']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # İlk kurulumda bir kez: scripts/uretim-baslat.ts (yönetici + asgari profil).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      TZ: Europe/Istanbul
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
